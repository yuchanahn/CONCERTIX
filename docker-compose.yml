services:
  postgres:
    image: postgres:17-alpine
    container_name: concert-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-concert}
      POSTGRES_USER: ${POSTGRES_USER:-concert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concert_dev}
    ports:
      - "5433:5432"
    volumes:
      - concert-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: concert-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - concert-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  concert-postgres-data:
  concert-redis-data:
