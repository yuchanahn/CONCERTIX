spring.application.name=demo
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/concert}
spring.datasource.username=${DB_USERNAME:concert}
spring.datasource.password=${DB_PASSWORD:concert_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.repositories.enabled=false

app.auth.jwt-secret=${JWT_SECRET:concert-local-development-secret-key-change-me-2026}
app.auth.access-token-ttl=${ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:7d}

app.queue.max-admitted=${QUEUE_MAX_ADMITTED:20}
app.queue.admission-ttl=${QUEUE_ADMISSION_TTL:2m}
